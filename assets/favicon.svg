<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="bggrad" cx="50%" cy="50%">
      <stop offset="0%"   stop-color="#5b8de8"/>
      <stop offset="100%" stop-color="#3060c0"/>
    </radialGradient>
    <radialGradient id="moongrad" cx="35%" cy="30%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8e0c0"/>
    </radialGradient>
    <radialGradient id="stargrad" cx="40%" cy="30%">
      <stop offset="0%"   stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
    <!-- 마스크: 큰 원 흰색(보임) - 작은 원 검정(가림) -->
    <mask id="moonmask">
      <circle cx="14" cy="17" r="10" fill="white"/>
      <circle cx="18" cy="14" r="7.8" fill="black"/>
    </mask>
  </defs>

  <!-- 파란 원 배경 -->
  <circle cx="16" cy="16" r="16" fill="url(#bggrad)"/>

  <!-- 초승달 — mask로 깔끔하게 -->
  <circle cx="14" cy="17" r="10" fill="url(#moongrad)" mask="url(#moonmask)"/>

  <!-- 별 -->
  <polygon
    points="22,9 23.2,12.8 27.2,12.8 24,15.1 25.2,18.9 22,16.6 18.8,18.9 20,15.1 16.8,12.8 20.8,12.8"
    fill="url(#stargrad)"/>
</svg>
